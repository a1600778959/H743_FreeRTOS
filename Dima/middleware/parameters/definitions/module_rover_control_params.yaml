module_name: definitions
parameters:
- group: Pure Pursuit
  definitions:
    PP_LOOKAHD_GAIN:
      category: System
      description:
        short: 纯追踪控制器前视距离增益
        long: |-
          较小的值会使路径跟踪更激进，并可能增大超调或振荡。
      type: float
      default: 1.0
      min: 0.1
      max: 100
      increment: 0.01
      decimal: 2
    PP_LOOKAHD_MIN:
      category: Developer
      description:
        short: 纯追踪控制器最小前视距离
      type: float
      default: 1.0
      unit: m
      min: 0.1
      max: 100
      increment: 0.01
      decimal: 2
    PP_LOOKAHD_MAX:
      category: Developer
      description:
        short: 纯追踪控制器最大前视距离
      type: float
      default: 10.0
      unit: m
      min: 0.1
      max: 100
      increment: 0.01
      decimal: 2
- group: Rover Navigation
  definitions:
    NAV_ACC_RAD:
      description:
        short: 默认航点到达判定半径
        long: |-
          当任务航点未提供大于 0 的独立到达半径时，使用此值。
      type: float
      default: 0.5
      unit: m
      min: 0.1
      max: 100
      increment: 0.1
      decimal: 2
- group: Rover Attitude Control
  definitions:
    RO_YAW_P:
      category: System
      description:
        short: 偏航角闭环控制器比例增益
      type: float
      default: 0.0
      min: 0
      max: 100
      increment: 0.01
      decimal: 3
- group: Rover Rate Control
  definitions:
    RO_YAW_STICK_DZ:
      category: Developer
      description:
        short: 偏航摇杆中位死区
        long: |-
          以摇杆输入范围的比例表示；中位附近落入此范围的输入按零处理。
      type: float
      default: 0.1
      min: 0
      max: 1
      increment: 0.01
      decimal: 2
    RO_YAW_EXPO:
      category: Developer
      description:
        short: 偏航角速度输入曲线指数系数
        long: |-
          用于调整输入曲线形状。
          0：纯线性输入曲线。
          1：纯三次输入曲线。
      type: float
      default: 0.0
      min: 0
      max: 1
      decimal: 2
    RO_YAW_SUPEXPO:
      category: Developer
      description:
        short: 偏航角速度输入曲线超指数系数
        long: |-
          在 RO_YAW_EXPO 调整的基础上，进一步修正输入曲线形状。
          0：仅使用原指数曲线。
          0.7：适度增强曲线形状，使摇杆手感更直观。
          0.95：曲线弯曲很强，仅接近最大行程的输入才有明显作用。
      type: float
      default: 0.0
      min: 0
      max: 0.95
      decimal: 2
    RO_YAW_RATE_TH:
      category: System
      description:
        short: 偏航角速度测量阈值
        long: |-
          实测偏航角速度及限幅后设定值的绝对值不大于此阈值时按零处理。
      type: float
      default: 3.0
      unit: deg/s
      min: 0
      max: 100
      increment: 0.01
      decimal: 2
    RO_YAW_RATE_P:
      category: System
      description:
        short: 偏航角速度闭环控制器比例增益
      type: float
      default: 0.0
      min: 0
      max: 100
      increment: 0.01
      decimal: 3
    RO_YAW_RATE_I:
      category: System
      description:
        short: 偏航角速度闭环控制器积分增益
      type: float
      default: 0.0
      min: 0
      max: 100
      increment: 0.01
      decimal: 3
    RO_YAW_RATE_LIM:
      description:
        short: 偏航角速度上限
        long: |-
          限制偏航角速度设定值；在特技、增稳和位置模式中，
          还用于将控制输入映射为偏航角速度设定值。
      type: float
      default: 0.0
      unit: deg/s
      min: 0
      max: 10000
      increment: 0.01
      decimal: 2
    RO_YAW_ACCEL_LIM:
      description:
        short: 偏航角加速度上限
        long: |-
          限制偏航角速度设定值幅值的增大速率。设为 -1 时禁用。
      type: float
      default: -1.0
      unit: deg/s^2
      min: -1
      max: 10000
      increment: 0.01
      decimal: 2
    RO_YAW_DECEL_LIM:
      description:
        short: 偏航角减速度上限
        long: |-
          限制偏航角速度设定值幅值的减小速率。设为 -1 时禁用。
      type: float
      default: -1.0
      unit: deg/s^2
      min: -1
      max: 10000
      increment: 0.01
      decimal: 2
    RO_YAW_RATE_CORR:
      category: System
      description:
        short: 偏航角速度前馈修正系数
        long: |-
          偏航角速度控制器前馈映射使用的乘法修正系数。
          实测角速度小于设定值时增大此值（x > 1），反之减小（0 < x < 1）。
          此项尤其适用于滑移转向车辆，或因车轮/转向轴不对齐而导致转向摩擦较大的车辆。
      type: float
      default: 1.0
      min: 0.01
      max: 10000
      increment: 0.01
      decimal: 2
- group: Rover Auto Calibration
  definitions:
    RO_CAL_XTE_MAX:
      category: System
      description:
        short: 自动校准路径最大横向误差
        long: |-
          正式导航标定实验允许的最大横向路径偏差，必须为有限正数。
          会话开始冻结此值；超差只判当前候选不合格，不与航点到达半径混用。
      type: float
      default: 0.20
      unit: m
      min: 0
      increment: 0.01
      decimal: 2
    RO_CAL_RADIUS:
      description:
        short: 自动校准位置约束半径
        long: |-
          约束转圈及二维路径校准；所有直线校准段使用独立的 RO_CAL_DIST。
          以进入校准时记录的 GNSS 位置为圆心，整个会话中圆心保持固定。
          仅约束定位参考点，不覆盖车辆的完整外廓。
          定位不确定度、延迟和停车距离都会压缩可用空间。
      type: float
      default: 20.0
      min: 1
      max: 100
      unit: m
      increment: 0.5
      decimal: 1
    RO_CAL_DIST:
      description:
        short: 自动校准直线距离
        long: |-
          所有直线校准段相对入场 GNSS 点的最大目标距离，不受 RO_CAL_RADIUS 裁短。
          直线阶段完成后返回同一入场点；到点容差为 0.5 m，不重设起点。
          制动距离由自动辨识的 RO_DECEL_LIM 按 v²/(2a) 计算，初值可为 -1/0。
          正式减速度测量从 MOT_THR_MAX 全输出的稳定实测车速反向驱动制动；场地不足则不保存结果。
          较短距离可能无法取得足够有效样本，不会因此降低校准质量要求。
      type: float
      default: 12.0
      min: 1
      max: 100
      unit: m
      increment: 0.1
      decimal: 2
- group: Rover Velocity Control
  definitions:
    RO_MAX_THR_SPEED:
      category: System
      description:
        short: 速度前馈的等效满输入速度
        long: |-
          用于将速度 [m/s] 线性映射为电机整形前的归一化控制输入 [-1, 1]。
          这是可观测运行范围内的等效前馈系数，包含当前电机 MIN/EXPO 配置的影响，
          不代表在巡航限速之外实测得到的物理最高车速。自动标定先形成动态响应候选，
          后续响应采集和闭环验证继续检验该线性近似；最终由会话统一保存。
      type: float
      default: 0.0
      min: 0
      max: 100
      unit: m/s
      increment: 0.01
      decimal: 2
    RO_SPEED_P:
      category: System
      description:
        short: 地速控制器比例增益
      type: float
      default: 0.0
      min: 0
      max: 100
      increment: 0.01
      decimal: 2
    RO_SPEED_I:
      category: System
      description:
        short: 地速控制器积分增益
      type: float
      default: 0.0
      min: 0
      max: 100
      increment: 0.001
      decimal: 3
    RO_SPEED_LIM:
      description:
        short: 导航巡航速度
        long: |-
          导航与自动校准共用的巡航速度。进入自动校准时冻结当时的正值为本会话
          速度上限；0 或历史值 -1 视为未配置，将拒绝自动校准运动（无安全上限可冻结）。
      type: float
      default: 1.0
      unit: m/s
      min: 0
      max: 100
      increment: 0.01
      decimal: 2
    RO_ACCEL_LIM:
      description:
        short: 加速度上限
        long: |-
          设为 -1 时禁用。对于麦克纳姆轮车辆，此限制同时用于纵向和横向加速度。
      type: float
      default: -1.0
      unit: m/s^2
      min: -1
      max: 100
      increment: 0.01
      decimal: 2
    RO_DECEL_LIM:
      description:
        short: 减速度上限
        long: |-
          设为 -1 时禁用。禁用后，车辆在自动模式下接近航点时不会减速。
          对于麦克纳姆轮车辆，此限制同时用于纵向和横向减速度。
          自动校准允许 -1/0 初值，先低速探测，再从全输出稳定车速执行两次反向驱动制动。
          两次有效测量通过后自动保存保守减速度；低速临时模型不作为正式结果保存。
          正式全输出测量允许超过 RO_SPEED_LIM，但仍受 RO_CAL_DIST、加速度和时间边界约束。
      type: float
      default: -1.0
      unit: m/s^2
      min: -1
      max: 100
      increment: 0.01
      decimal: 2
    RO_JERK_LIM:
      category: Developer
      description:
        short: 加加速度上限
        long: |-
          设为 -1 时禁用。禁用后，车辆在自动模式下接近航点时不会减速。
          对于麦克纳姆轮车辆，此限制同时用于纵向和横向加加速度。
      type: float
      default: -1.0
      unit: m/s^3
      min: -1
      max: 100
      increment: 0.01
      decimal: 2
    RO_SPEED_TH:
      category: System
      description:
        short: 速度测量阈值
        long: |-
          实测速度的绝对值不大于此阈值时按零处理。此参数只接受非负值，
          设为 0 时不再抑制非零速度测量；不会截断速度设定值。
      type: float
      default: 0.1
      unit: m/s
      min: 0
      max: 100
      increment: 0.01
      decimal: 2
    RO_SPEED_RED:
      category: Developer
      description:
        short: 根据航迹方向误差减速的增益
        long: |-
          降速后速度 = RO_MAX_THR_SPEED ×（1 - 归一化航迹方向误差 × RO_SPEED_RED）。
          归一化航迹方向误差为当前航迹方向与目标方位之间的夹角，
          从 [0, 180] 度线性映射到 [0, 1]。值越大，减速越明显。
          此项也用于计算自动模式下车辆到达航点时的速度。
          设为 -1 时禁用基于方向误差的减速。
      type: float
      default: -1.0
      min: -1
      max: 100
      increment: 0.01
      decimal: 2
